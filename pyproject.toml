[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.2.0"
description = "Multi-broker portfolio risk and stress-testing engine: VaR/CVaR, backtests, Monte Carlo, stress tests"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Onur Ozkara" }]
keywords = ["risk", "var", "cvar", "portfolio", "monte-carlo", "stress-test", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "typer>=0.12",
    "loguru>=0.7",
    "rich>=13.7",
    "streamlit>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs>=2.2", "scipy-stubs>=1.12"]

[project.urls]
Homepage = "https://github.com/ozkaraonur/portfolio-risk-engine"
Issues = "https://github.com/ozkaraonur/portfolio-risk-engine/issues"

[project.scripts]
pre = "portfolio_risk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_risk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/portfolio_risk/web/*" = ["RUF001", "RUF002", "RUF003"]  # Turkish UI text
"src/portfolio_risk/catalog.py" = ["RUF001", "RUF002", "RUF003"]  # Turkish asset names
"src/portfolio_risk/web/i18n.py" = ["E501", "RUF001", "RUF002", "RUF003"]  # translations
"tests/test_web.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_i18n.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_catalog.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]
