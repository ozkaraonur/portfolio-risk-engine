[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.1.0"
description = "Multi-broker portfolio risk and stress-testing engine"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "typer>=0.12",
    "loguru>=0.7",
    "rich>=13.7",
    "streamlit>=1.35",
]

[project.scripts]
pre = "portfolio_risk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_risk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"src/portfolio_risk/web/*" = ["RUF001", "RUF002", "RUF003"]  # Turkish UI text
"src/portfolio_risk/catalog.py" = ["RUF001", "RUF002", "RUF003"]  # Turkish asset names
"tests/test_web.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_catalog.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "examples"]
